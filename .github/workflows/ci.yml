# =============================================================================
# CI - AdoptMe Backend III - Autor: Jeshua Romero Guadarrama
# -----------------------------------------------------------------------------
# Se ejecutan lint, tests y build de la imagen Docker en cada push y PR.
# =============================================================================

name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  test:
    name: Tests funcionales
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test

  docker:
    name: Build imagen Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (sin push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: adoptme-backend-iii:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
